<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111714" />
    <title>CAVPRIME</title>
    <link
      rel="icon"
      type="image/png"
      href="./assets/cavprime/five-logos-20260926/portal-official-png-v2/ultimate_enem.png"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #111714;
        color: #f7f7f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #111714;
      }

      main {
        width: min(360px, calc(100% - 40px));
        text-align: center;
      }

      img {
        display: block;
        width: min(230px, 74vw);
        height: auto;
        margin: 0 auto 24px;
      }

      p {
        margin: 0;
        color: #d2b275;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="./assets/cavprime/final-20260925/07_USER_APPROVED/corrected_v8_png/cavprime_signature_hero_match.png"
        alt="CAVPRIME"
      />
      <p>Preparando sua experiência.</p>
      <noscript>
        <p>
          <a href="./experiments/front-gpt-hard-test/?auditReview=0#/portal">Entrar no CAVPRIME</a>
        </p>
      </noscript>
    </main>
    <script>
      (async () => {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
        } finally {
          window.location.replace("./experiments/front-gpt-hard-test/?auditReview=0#/portal");
        }
      })();
    </script>
  </body>
</html>
